
name: Java CI with Maven

on:
  push:
    branches:
      - cicd

jobs:
  build-and-develop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build JAR
        run: chmod +x mvnw && ./mvnw clean package

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/spring-boot-ci-demo:${GITHUB_SHA}" \
            .

      - name: Push Image to Docker Hub
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/spring-boot-ci-demo:${GITHUB_SHA}"

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          IMAGE_URL="docker.io/${DOCKER_USERNAME}/spring-boot-ci-demo:${GITHUB_SHA}"
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"
